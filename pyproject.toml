[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cccp-supervisor"
version = "0.1.1"
description = "Deterministic local lifecycle supervisor for CCCP agent collaboration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ccc-supervisor = "cccp_supervisor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
